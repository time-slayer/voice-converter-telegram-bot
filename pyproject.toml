[project]
name = "voice-converter"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
  "python-dotenv>=1.2.2",
  "python-telegram-bot>=22.8",
]

[project.scripts]
voice-converter = "voice_converter.bot:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"
